# The HADS application: static SPA, API + websocket proxy, cached base-map tiles. Included by the HTTP server
# (when no certificate is installed) or by the HTTPS server.
root /usr/share/nginx/html;
index index.html;
client_max_body_size 6m;   # demographics CSV import (5 MB) + multipart overhead
server_tokens off;

gzip on;
gzip_types text/plain text/css application/json application/javascript image/svg+xml;

include /etc/nginx/hads/security-headers.conf;

# Live tracking sockets and emergency intake are never capped per client IP: mobile carriers (CGNAT) and call
# centres put many people behind one address, and a tracking socket stays open for the whole trip.
location ^~ /api/ws {
  include /etc/nginx/hads/api-proxy.conf;
}

location ^~ /api/requests {
  include /etc/nginx/hads/api-proxy.conf;
}

location = /api/auth/guest {
  include /etc/nginx/hads/api-proxy.conf;
}

# Everything else: a generous per-IP concurrency cap so one source cannot monopolise the backend (the backend's own
# admission control still queues bursts fairly).
location /api/ {
  limit_conn hads_api_conn 200;
  limit_conn_status 503;
  include /etc/nginx/hads/api-proxy.conf;
}

location /tiles/ {
  set $args $stadia_args;
  rewrite ^/tiles/(\d+/\d+/\d+(@2x)?\.png)$ /tiles/alidade_smooth/$1 break;
  proxy_pass https://tiles.stadiamaps.com;
  proxy_ssl_server_name on;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Cookie "";
  proxy_cache tiles;
  proxy_cache_key $uri;
  proxy_cache_valid 200 30d;
  proxy_cache_valid any 1m;
  proxy_cache_lock on;
  proxy_cache_use_stale error timeout updating;
  proxy_ignore_headers Set-Cookie Cache-Control Expires;
  include /etc/nginx/hads/security-headers.conf;
  add_header Cache-Control "public, max-age=604800";
  add_header X-Tile-Cache $upstream_cache_status;
}

# The service worker and manifest must always be revalidated, or clients keep an old worker for days.
location = /sw.js {
  include /etc/nginx/hads/security-headers.conf;
  add_header Cache-Control "no-cache";
  try_files $uri =404;
}

location = /manifest.webmanifest {
  include /etc/nginx/hads/security-headers.conf;
  add_header Cache-Control "no-cache";
  default_type application/manifest+json;
  try_files $uri =404;
}

location /assets/ {
  expires 1y;
  include /etc/nginx/hads/security-headers.conf;
  add_header Cache-Control "public, immutable";
  try_files $uri =404;
}

# The app shell names the current hashed bundles: always revalidate it, or browsers keep loading an old release.
location = /index.html {
  include /etc/nginx/hads/security-headers.conf;
  add_header Cache-Control "no-cache";
}

location / {
  include /etc/nginx/hads/security-headers.conf;
  add_header Cache-Control "no-cache";
  try_files $uri $uri/ /index.html;
}
