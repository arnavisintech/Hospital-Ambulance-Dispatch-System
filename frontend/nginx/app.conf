# The HADS application: static SPA, API + websocket proxy, cached base-map tiles. Included by the HTTP server
# (when no certificate is installed) or by the HTTPS server.
root /usr/share/nginx/html;
index index.html;
client_max_body_size 6m;   # demographics CSV import (5 MB) + multipart overhead
server_tokens off;

gzip on;
gzip_types text/plain text/css application/json application/javascript image/svg+xml;

include /etc/nginx/hads/security-headers.conf;

location /api/ {
  proxy_pass http://backend:8000;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, never append a client-supplied value
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-ID $request_id;
  proxy_read_timeout 3600s;
}

location /tiles/ {
  set $args $stadia_args;
  rewrite ^/tiles/(\d+/\d+/\d+(@2x)?\.png)$ /tiles/alidade_smooth/$1 break;
  proxy_pass https://tiles.stadiamaps.com;
  proxy_ssl_server_name on;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Cookie "";
  proxy_cache tiles;
  proxy_cache_key $uri;
  proxy_cache_valid 200 30d;
  proxy_cache_valid any 1m;
  proxy_cache_lock on;
  proxy_cache_use_stale error timeout updating;
  proxy_ignore_headers Set-Cookie Cache-Control Expires;
  include /etc/nginx/hads/security-headers.conf;
  add_header Cache-Control "public, max-age=604800";
  add_header X-Tile-Cache $upstream_cache_status;
}

location /assets/ {
  expires 1y;
  include /etc/nginx/hads/security-headers.conf;
  add_header Cache-Control "public, immutable";
  try_files $uri =404;
}

location / {
  try_files $uri $uri/ /index.html;
}
