# HADS production stack (single host). Only the web front end is published; the API, database and road router
# are reachable only on the internal network. Secrets come from ./.env (copy .env.example; generate with
# `python backend/scripts/gen_keys.py`). Compose refuses to start when a required value is missing.
#
#   docker compose up -d --build                                                          # production
#   docker compose --env-file demo.env -f docker-compose.yml -f docker-compose.demo.yml up -d  # demo (start-demo.bat)
#   ... -f docker-compose.dev.yml                                                          # + localhost dev ports
services:
  db:
    build: ./infra/postgres          # postgres:16-alpine + continuous WAL archiving to the pg-wal volume
    environment:
      POSTGRES_USER: hads
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: hads
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pg-wal:/wal
      - ${BACKUP_DIR:-pg-backups}:/backups:ro   # read by scripts/restore-db.sh only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hads"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  # Base backup at start (if none yet) and every BACKUP_INTERVAL_H hours; keeps BACKUP_KEEP. Together with the
  # archived WAL this allows point-in-time recovery (scripts/restore-db.sh).
  # Point BACKUP_DIR at a second disk (or a synced folder) so a backup survives the loss of the data disk.
  backup:
    build: ./infra/postgres
    entrypoint: ["/usr/local/bin/loop.sh"]
    environment:
      PGHOST: db
      PGUSER: hads
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      BACKUP_INTERVAL_H: ${BACKUP_INTERVAL_H:-24}
    volumes:
      - ${BACKUP_DIR:-pg-backups}:/backups
      - pg-wal:/wal
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped

  # One-shot: download Geofabrik southern-zone, clip to Chennai with osmium, osrm-extract/partition/customize (MLD)
  # into the osrm-data volume. A no-op once the dataset exists. First run: ~600 MB download, a few minutes CPU,
  # ~2 GB RAM peak. Rebuild: `docker compose rm -sf osrm osrm-prep && docker volume rm <project>_osrm-data`.
  osrm-prep:
    build:
      context: ./infra/osrm
      args:
        OSRM_IMAGE: ${OSRM_IMAGE:-osrm/osrm-backend:v5.25.0}
    environment:
      DATA_DIR: /data
      PBF_URL: ${OSRM_PBF_URL:-https://download.geofabrik.de/asia/india/southern-zone-latest.osm.pbf}
      BBOX: "79.95,12.75,80.40,13.30"
      OSRM_NAME: chennai
    volumes: [osrm-data:/data]
    restart: "no"

  # Road router (MLD). OSRM knows free-flow speeds only; the backend applies the time-of-day traffic factor.
  osrm:
    image: ${OSRM_IMAGE:-osrm/osrm-backend:v5.25.0}
    command: ["osrm-routed", "--algorithm", "mld", "--max-table-size", "500", "/data/chennai.osrm"]
    volumes: [osrm-data:/data:ro]
    depends_on:
      osrm-prep: {condition: service_completed_successfully}
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+psycopg2://hads:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/hads
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (python backend/scripts/gen_keys.py)}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?set DATA_ENCRYPTION_KEY in .env (python backend/scripts/gen_keys.py)}
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS in .env, e.g. https://hads.example.org}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      ROUTING_PROVIDER: osrm
      OSRM_URL: http://osrm:5000     # falls back to haversine automatically if OSRM is down or slower than 1.5 s
      LOG_JSON: ${LOG_JSON:-true}
      SERVICE_AREA: ${SERVICE_AREA:-12.80,79.98,13.25,80.35}   # city = SERVICE_AREA + CITY_LAT/CITY_LNG (STRQ5)
      CITY_LAT: ${CITY_LAT:-13.0827}
      CITY_LNG: ${CITY_LNG:-80.2707}
    depends_on:
      db: {condition: service_healthy}
      # not required: without OSRM (e.g. no internet for the first prep) the backend still runs on haversine
      osrm: {condition: service_started, required: false}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_CITY_CENTER: ${CITY_LAT:-13.0827},${CITY_LNG:-80.2707}
    environment:
      STADIA_API_KEY: ${STADIA_API_KEY:-}   # required once served from a real domain (free at stadiamaps.com)
    volumes: ["${CERTS_DIR:-./certs}:/etc/nginx/certs:ro"]   # fullchain.pem + privkey.pem enable HTTPS
    depends_on: [backend]
    ports: ["${HTTP_PORT:-80}:80", "${HTTPS_PORT:-443}:443"]
    restart: unless-stopped

volumes:
  pgdata:
  pg-wal:
  pg-backups:
  osrm-data:
