# Development overlay: publishes the internal services on localhost for debugging and local tooling
# (psql, alembic against Postgres, the backend API without nginx).
#   docker compose --env-file demo.env -f docker-compose.yml -f docker-compose.dev.yml up -d db osrm
services:
  db:
    ports: ["127.0.0.1:5432:5432"]
  osrm:
    ports: ["127.0.0.1:5000:5000"]
  backend:
    ports: ["127.0.0.1:8000:8000"]
